# Local development, bound to loopback. Production uses compose.prod.yml.
services:
  battle-sim:
    build: .
    image: battle-sim:local
    ports: ["127.0.0.1:7878:7878"]
    environment:
      BATTLE_ADMIN_PASSWORD: ${BATTLE_ADMIN_PASSWORD:?set a random password of at least 16 characters}
    command: ["--allow-unauthenticated-bots", "--replay-dir", "/app/replays"]
    volumes:
      - local-replays:/app/replays
volumes:
  local-replays:
