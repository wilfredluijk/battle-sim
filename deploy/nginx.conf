# Installed under /etc/nginx/sites-available/battle-sim (inside http context).
log_format battle_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=bot_attempts:1m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=bot_peers:1m;
limit_conn_zone $server_name zone=bot_global:1m;
server {
    listen 80;
    listen [::]:80;
    server_name 93.190.187.250;
    client_header_timeout 5s;
    client_body_timeout 5s;
    keepalive_timeout 5s;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 404; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 93.190.187.250;
    ssl_certificate /etc/letsencrypt/live/battle-sim/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/battle-sim/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BattleTLS:1m;
    ssl_session_timeout 10m;
    server_tokens off;
    client_header_timeout 5s;
    client_body_timeout 5s;
    client_max_body_size 16k;
    large_client_header_buffers 2 4k;
    keepalive_timeout 5s;
    send_timeout 10s;
    # Log paths without query strings. Credentials are sent inside the WebSocket.
    access_log /var/log/nginx/battle-sim-access.log battle_safe;
    location = /bot {
        limit_req zone=bot_attempts burst=16 nodelay;
        limit_req_status 429;
        limit_conn bot_peers 20;
        limit_conn bot_global 32;
        if ($request_method != GET) { return 405; }
        proxy_pass http://127.0.0.1:7878;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
        proxy_send_timeout 10s;
        proxy_buffering off;
    }
    location / { return 404; }
}
